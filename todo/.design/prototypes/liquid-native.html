<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Todo App — Liquid Native</title>
<style>
:root {
  --color-primary: #007AFF; --color-bg-light: #F2F2F7; --color-bg-dark: #000000;
  --motion-duration: 500ms; --motion-easing: cubic-bezier(0.32, 0.72, 0.32, 1.08);
  --radius-card: 16px;
}
@media (prefers-color-scheme: light) { :root { --color-bg: var(--color-bg-light); } }
@media (prefers-color-scheme: dark) { :root { --color-bg: var(--color-bg-dark); color: white; } }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: SF Pro, -apple-system, sans-serif; background: #2a2a2a; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 40px 0; }
.device { width: 393px; height: 852px; background: linear-gradient(180deg, #FFE5D9 0%, #F2F2F7 100%); border-radius: 55px; position: relative; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,0.5); }
.device::before { content: ""; position: absolute; top: 11px; left: 50%; /* swiftui: layout-only */ transform: translateX(-50%); width: 126px; height: 37px; background: #000; border-radius: 20px; z-index: 100; }
.status-bar { position: absolute; top: 0; left: 0; right: 0; height: 54px; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 24px 8px; font-size: 17px; font-weight: 600; z-index: 50; }
.home-indicator { position: absolute; bottom: 8px; left: 50%; /* swiftui: layout-only */ transform: translateX(-50%); width: 134px; height: 5px; background: currentColor; border-radius: 3px; opacity: 0.6; z-index: 50; }
.safe-area { position: absolute; top: 59px; left: 0; right: 0; bottom: 34px; overflow-y: auto; padding: 0 16px; }
.task-card { /* swiftui: .scaleEffect on press */ transition: transform var(--motion-duration) var(--motion-easing); }
.task-card:active { transform: scale(0.97); }
</style>
</head>
<body>
<div class="device">
  <div class="status-bar"><span>9:41</span><span>·· 􀙇 􀛨</span></div>
  <div class="safe-area">
    <h1 style="padding: 24px 0 8px; font-size: 34px; font-weight: 700;">Today</h1>
    <p style="font-size: 15px; opacity: 0.6; padding-bottom: 16px;">7 tasks · 3 done</p>

    <!-- swiftui: ForEach(tasks) { task in TaskCard(task).matchedGeometryEffect(id: task.id, in: ns) } -->
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <!-- swiftui: CardView with .glassEffect() | fallback .background(.ultraThinMaterial) -->
      <div class="task-card" style="background: rgba(255,255,255,0.7); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border-radius: var(--radius-card); padding: 16px; display: flex; gap: 12px; align-items: center;">
        <div style="width: 22px; height: 22px; border-radius: 11px; background: var(--color-primary); display: flex; align-items: center; justify-content: center; color: white; font-size: 13px;">✓</div>
        <div style="flex: 1;"><h4 style="font-size: 16px; font-weight: 500; opacity: 0.4; text-decoration: line-through;">Reply to Sam re: design tokens</h4></div>
      </div>
      <div class="task-card" style="background: rgba(255,255,255,0.7); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border-radius: var(--radius-card); padding: 16px; display: flex; gap: 12px; align-items: center;">
        <div style="width: 22px; height: 22px; border-radius: 11px; border: 1.5px solid rgba(0,0,0,0.3);"></div>
        <div style="flex: 1;"><h4 style="font-size: 16px; font-weight: 500;">Draft Q3 metrics deck</h4><p style="font-size: 13px; opacity: 0.6; margin-top: 2px;">14:00 · work</p></div>
      </div>
      <div class="task-card" style="background: rgba(255,255,255,0.7); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border-radius: var(--radius-card); padding: 16px; display: flex; gap: 12px; align-items: center;">
        <div style="width: 22px; height: 22px; border-radius: 11px; border: 1.5px solid rgba(0,0,0,0.3);"></div>
        <div style="flex: 1;"><h4 style="font-size: 16px; font-weight: 500;">Pick up dry cleaning</h4><p style="font-size: 13px; opacity: 0.6; margin-top: 2px;">17:00 · personal</p></div>
      </div>
      <div class="task-card" style="background: rgba(255,255,255,0.7); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border-radius: var(--radius-card); padding: 16px; display: flex; gap: 12px; align-items: center;">
        <div style="width: 22px; height: 22px; border-radius: 11px; border: 1.5px solid rgba(0,0,0,0.3);"></div>
        <div style="flex: 1;"><h4 style="font-size: 16px; font-weight: 500;">Call dad about weekend</h4><p style="font-size: 13px; opacity: 0.6; margin-top: 2px;">18:30 · personal</p></div>
      </div>
    </div>
  </div>
  <div class="home-indicator"></div>
</div>
</body>
</html>
