<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><title>Todo App — Playful Character</title>
<style>
:root {
  --color-primary: #FF5E5B; --color-bg-light: #FFFEF7; --color-bg-dark: #1B1A1F;
  --motion-duration: 400ms; --motion-easing: cubic-bezier(0.18, 0.89, 0.32, 1.28);
}
@media (prefers-color-scheme: light) { :root { --color-bg: var(--color-bg-light); } }
@media (prefers-color-scheme: dark) { :root { --color-bg: var(--color-bg-dark); color: white; } }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'SF Pro Rounded', -apple-system, sans-serif; background: #2a2a2a; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 40px 0; }
.device { width: 393px; height: 852px; background: var(--color-bg); border-radius: 55px; position: relative; overflow: hidden; box-shadow: 0 30px 80px rgba(0,0,0,0.5); }
.device::before { content: ""; position: absolute; top: 11px; left: 50%; /* swiftui: layout-only */ transform: translateX(-50%); width: 126px; height: 37px; background: #000; border-radius: 20px; z-index: 100; }
.status-bar { position: absolute; top: 0; left: 0; right: 0; height: 54px; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 24px 8px; font-size: 17px; font-weight: 600; z-index: 50; }
.home-indicator { position: absolute; bottom: 8px; left: 50%; /* swiftui: layout-only */ transform: translateX(-50%); width: 134px; height: 5px; background: currentColor; border-radius: 3px; opacity: 0.6; z-index: 50; }
.safe-area { position: absolute; top: 59px; left: 0; right: 0; bottom: 34px; overflow-y: auto; padding: 0 20px; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.2) rotate(-5deg); } 100% { transform: scale(1); } }
/* swiftui: .symbolEffect(.bounce) triggered by celebrate() */
.popping { animation: pop 0.4s var(--motion-easing); }
.task-card { /* swiftui: .scaleEffect on press via .buttonStyle */ transition: transform var(--motion-duration) var(--motion-easing); }
.task-card:active { transform: scale(0.95); }
.task-card.done .checkbox { background: var(--color-primary); border-color: var(--color-primary); }
.task-card.done h4 { opacity: 0.4; text-decoration: line-through; }
</style>
</head>
<body>
<div class="device">
  <div class="status-bar"><span>9:41</span><span>·· 􀙇 􀛨</span></div>
  <div class="safe-area">
    <div style="display: flex; align-items: center; gap: 12px; padding: 24px 0 8px;">
      <!-- swiftui: phaseAnimator on streak count change -->
      <div onclick="this.classList.remove('popping');void this.offsetWidth;this.classList.add('popping');" style="width: 56px; height: 56px; border-radius: 28px; background: linear-gradient(135deg, #FFE74C, #FF5E5B); display: flex; align-items: center; justify-content: center; font-size: 32px; cursor: pointer;">🔥</div>
      <div>
        <h1 style="font-size: 28px; font-weight: 700;">Today</h1>
        <p style="font-size: 14px; opacity: 0.6;">3 of 7 — 7 day streak!</p>
      </div>
    </div>

    <!-- swiftui: ForEach(tasks) { TaskCard(...).symbolEffect(.bounce, value: task.isDone) } -->
    <div style="display: flex; flex-direction: column; gap: 14px; margin-top: 16px;">
      <div class="task-card done" onclick="toggleTask(this)" style="background: white; border-radius: 24px; padding: 18px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; gap: 14px; align-items: center;">
        <div class="checkbox" style="width: 24px; height: 24px; border: 2px solid rgba(0,0,0,0.2); border-radius: 12px; transition: all var(--motion-duration) var(--motion-easing); flex-shrink: 0;"></div>
        <h4 style="font-size: 16px; font-weight: 500;">Reply to Sam ✏️</h4>
      </div>
      <div class="task-card" onclick="toggleTask(this)" style="background: white; border-radius: 24px; padding: 18px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; gap: 14px; align-items: center;">
        <div class="checkbox" style="width: 24px; height: 24px; border: 2px solid rgba(0,0,0,0.2); border-radius: 12px; transition: all var(--motion-duration) var(--motion-easing); flex-shrink: 0;"></div>
        <div><h4 style="font-size: 16px; font-weight: 500;">Draft Q3 metrics 📊</h4><p style="font-size: 13px; opacity: 0.6; margin-top: 2px;">14:00</p></div>
      </div>
      <div class="task-card" onclick="toggleTask(this)" style="background: white; border-radius: 24px; padding: 18px 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; gap: 14px; align-items: center;">
        <div class="checkbox" style="width: 24px; height: 24px; border: 2px solid rgba(0,0,0,0.2); border-radius: 12px; transition: all var(--motion-duration) var(--motion-easing); flex-shrink: 0;"></div>
        <div><h4 style="font-size: 16px; font-weight: 500;">Pick up cleaning 🧺</h4><p style="font-size: 13px; opacity: 0.6; margin-top: 2px;">17:00</p></div>
      </div>
    </div>
  </div>
  <div class="home-indicator"></div>
</div>
<script>
function toggleTask(el) { el.classList.toggle('done'); el.classList.remove('popping'); void el.offsetWidth; el.classList.add('popping'); }
</script>
</body>
</html>
